name: Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Grant write permissions for GitHub Container Registry (GHCR) packages
permissions:
  contents: read
  packages: write

jobs:
  backend-build:
    name: Backend Build & Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Docker status
        run: docker info

      - name: Build and Verify Backend
        run: mvn -B clean verify

      - name: Verify Backend Dockerfile build
        run: docker build -t backend-test:latest .

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  frontend-build:
    name: Frontend Build & Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Lint & Typecheck
        run: npm run lint

      - name: Build Frontend Production Assets
        run: npm run build

      - name: Verify Frontend Dockerfile build
        run: docker build -t frontend-test:latest .

  deploy:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    # Only run this job on push/merge to the main/master branches, and only if tests pass
    if: (github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [backend-build, frontend-build]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Log in to GitHub Container Registry (GHCR) using GITHUB_TOKEN
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compile Backend JAR first (needed for Docker COPY command)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend JAR
        run: mvn -B clean package -DskipTests
        working-directory: backend

      # Build and push Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      # Build and push Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
