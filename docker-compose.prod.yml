services:
  db:
    image: postgres:latest
    container_name: postgres-tasks2db-prod
    environment:
      POSTGRES_DB: tasks2db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password_here # RECOMMENDED: Change this password
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks2db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - task-network
    restart: always

  backend:
    image: ghcr.io/nguyenducviet22/ai-assisted-task-manager/backend:latest
    container_name: taskmanagement-backend-prod
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tasks2db?options=-c%20timezone=UTC
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secure_password_here # MUST MATCH DB PASSWORD ABOVE
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - task-network
    restart: always

  frontend:
    image: ghcr.io/nguyenducviet22/ai-assisted-task-manager/frontend:latest
    container_name: taskmanagement-frontend-prod
    ports:
      - "80:3000" # Maps port 80 (standard HTTP web traffic) to container port 3000
    depends_on:
      - backend
    networks:
      - task-network
    restart: always

volumes:
  postgres_prod_data:

networks:
  task-network:
    driver: bridge
